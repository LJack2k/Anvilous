name: Release

# Fires when you push a git tag starting with "v". The tag carries the MC line, because
# every line lives in this one repo and two of them must not collide:
#     git tag v0.1.0-mc1.21.1
#     git push origin v0.1.0-mc1.21.1
#
# This workflow ONLY builds the jar and creates the GitHub Release. The
# CurseForge + Modrinth uploads are separate workflows that run after this one
# completes (see publish-curseforge.yml / publish-modrinth.yml), so a single
# platform can be retried without rebuilding.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # create the GitHub Release and attach the jar

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single source of truth: read the MC version, Java version and mod version
      # from gradle.properties so this one workflow serves every MC line
      # (1.21.1, 26.1, ...). Nothing about the target version is hardcoded here.
      - name: Read build properties
        id: props
        run: |
          echo "mc=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "java=$(grep -E '^java_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "modver=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "loaders=$(grep -E '^mod_loaders=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "modname=$(grep -E '^mod_name=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # Gate the whole release on the notes being present and correctly styled.
      # Both failures are otherwise silent and only visible once published: a
      # missing file makes mc-publish substitute an auto-generated commit list,
      # and an em dash is an easy habit to slip in. Publishing is chained off this
      # workflow succeeding, so checking here covers CurseForge and Modrinth too.
      - name: Check the release notes
        run: |
          FILE="changelogs/${{ steps.props.outputs.modver }}.md"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE is missing. Write the release notes before tagging."
            exit 1
          fi
          # Matched as raw UTF-8 bytes under LC_ALL=C rather than with grep -P:
          # -P is unavailable in some locales and *silently finds nothing* there,
          # which would turn this guard into a no-op that always passes.
          if LC_ALL=C grep -n $'\xe2\x80\x94' "$FILE"; then
            echo "::error::$FILE uses an em dash. Changelog files must use a plain hyphen '-'."
            exit 1
          fi
          echo "OK: $FILE present, no em dashes."

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.props.outputs.java }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Create GitHub Release
        # Omitting curseforge-id/modrinth-id makes mc-publish only create the
        # GitHub Release here; the platform publishes pick up from there.
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: |
            **/build/libs/!(*-sources).jar

          # The GitHub Release title, which is the thing a player reads when they land
          # on the Releases page. The jar attached to it already carries the loader and
          # the exact filename, so the title does not repeat them.
          name: ${{ steps.props.outputs.modname }} ${{ steps.props.outputs.modver }} for Minecraft ${{ steps.props.outputs.mc }}
          # +<mc> build-metadata keeps the version unique per MC line on Modrinth
          # (e.g. 1.2.0+1.21.1 vs 1.2.0+26.1), which requires unique version numbers.
          version: "${{ steps.props.outputs.modver }}+${{ steps.props.outputs.mc }}"
          version-type: release

          loaders: ${{ steps.props.outputs.loaders }}
          game-versions: ${{ steps.props.outputs.mc }}
          java: ${{ steps.props.outputs.java }}

          # The release notes for THIS version, written before tagging. The path is
          # built from mod_version, so it needs no per-line handling — every MC line
          # ships the same note. This becomes the GitHub Release body, and the
          # platform publishes read the same file (see publish-*.yml). Write
          # changelogs/<mod_version>.md as part of cutting a release: mc-publish
          # falls back to an auto-generated commit list if the file is missing.
          changelog-file: changelogs/${{ steps.props.outputs.modver }}.md
