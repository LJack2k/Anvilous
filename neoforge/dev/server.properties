# Dev harness server config. TRACKED, and copied over run-server/server.properties
# by the prepareDevServer Gradle task on every runServer - so edit it here, not there,
# and so a fresh clone gets the same world rather than a default one.
#
# The world is deliberately boring: superflat, permanently noon, dry, and empty of
# anything that moves. Daylight and weather are world state rather than server config,
# so DevHarness pins those on server start.

level-name=world
level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
generate-structures=false

difficulty=peaceful
gamemode=creative
force-gamemode=true
spawn-monsters=false
spawn-animals=false
spawn-npcs=false
spawn-protection=0

online-mode=false
enable-command-block=true
motd=Anvilous dev harness
view-distance=6

# RCON, so the harness can be driven without touching the game window.
enable-rcon=true
rcon.password=anvilous
rcon.port=25575
broadcast-rcon-to-ops=true

# No watchdog kill while sitting on a breakpoint.
max-tick-time=-1
