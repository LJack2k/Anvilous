plugins {
    id 'java-library'
    // ModDevGradle — the modern way to develop NeoForge mods. 1.x serves the
    // 1.21.x line; the 26.1 branch moves to 2.x (Gradle 9 / Java 25).
    id 'net.neoforged.moddev' version '1.0.20'
}

version = mod_version
group = mod_group_id

java {
    // Driven by java_version in gradle.properties so the toolchain and the
    // release workflow can never drift (1.21.x = 21, 26.1+ = 25).
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

base {
    archivesName = "${mod_name}-neoforge-${minecraft_version}"
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        // JEI's own config library lives here too, under its own group.
        content {
            includeGroup 'mezz.jei'
            includeGroupByRegex 'net\\.mezzdev.*'
        }
    }
    maven {
        name = 'Sleeping Town'
        url = 'https://repo.sleeping.town/'
        content { includeGroup 'dev.emi' }
    }
    flatDir { dirs 'libs' }
}

// Which recipe viewer the dev runs start with: jei (default), emi, or both. EMI carries its
// own JEI compatibility layer, so running with emi alone is how we find out whether our JEI
// plugin is loaded by something that is not JEI - which no amount of documentation settled.
//   gradlew :neoforge:runClientJoin -Precipe_viewer=emi
var recipeViewer = project.findProperty('recipe_viewer') ?: 'jei'

dependencies {
    // Compile against the API only, so the plugin can be written; at runtime a whole viewer
    // is on the dev classpath so it can be looked at. Neither is a dependency of the mod -
    // the plugin class is never touched unless a viewer loads it.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"

    if (recipeViewer in ['jei', 'both']) {
        runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
    if (recipeViewer in ['emi', 'both']) {
        runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'anvilous.devWindowX', dev_window_x
            systemProperty 'anvilous.devWindowY', dev_window_y
            programArguments.addAll '--width', '1920', '--height', '1000'
        }
        // Auto-joining dev client + dedicated server for the RCON/screenshot harness
        // (dev-only; enabled by the anvilous.devHarness system property). Separate game
        // dirs so client and server don't contend on world and log locks.
        clientJoin {
            client()
            gameDirectory = file('run-client')
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'anvilous.devWindowX', dev_window_x
            systemProperty 'anvilous.devWindowY', dev_window_y
            systemProperty 'anvilous.devHarness', 'true'
            // Force IPv4. Minecraft's game port is bound by Netty, which on Windows
            // creates a v6-ONLY socket for the wildcard bind, so an IPv4 connect to
            // 127.0.0.1 is never accepted and --quickPlayMultiplayer just hangs until
            // the login timeout. Both sides must agree, hence the same flag below.
            jvmArguments.addAll '-Xmx4G', '-Djava.net.preferIPv4Stack=true'
            programArguments.addAll '--width', '1920', '--height', '1000',
                    '--quickPlayMultiplayer', '127.0.0.1:25565'
        }
        server {
            server()
            gameDirectory = file('run-server')
            systemProperty 'anvilous.devHarness', 'true'
            programArgument '--nogui'
            jvmArguments.addAll '-Xmx4G', '-Djava.net.preferIPv4Stack=true'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        neo_version_range       : neo_version_range,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_display_name        : mod_display_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description,
        jei_version_range       : jei_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// --- Dev server world -------------------------------------------------------
// run-server/ is gitignored, so its server.properties would otherwise be whatever
// Minecraft generated the first time - a normal survival world with mobs and a day
// cycle, different on every clone. dev/server.properties is tracked and copied over
// it on every run instead, which makes the flat, peaceful, permanently-noon test
// world reproducible. Edit dev/server.properties, never run-server's copy.
var prepareDevServer = tasks.register('prepareDevServer') {
    description = 'Installs the tracked dev server.properties and accepts the EULA.'
    doLast {
        var runDir = file('run-server')
        runDir.mkdirs()
        // The dev EULA acceptance is the developer's, for a throwaway local world.
        new File(runDir, 'eula.txt').text = 'eula=true\n'
        new File(runDir, 'server.properties').text = file('dev/server.properties').text
        logger.lifecycle('prepareDevServer: flat peaceful world config installed.')
    }
}

tasks.matching { it.name == 'runServer' }.configureEach {
    dependsOn prepareDevServer
}

// --- Dev client window placement --------------------------------------------
// Minecraft has no window-position startup parameter, and the first window shown is
// FML's early loading window, created before any mod code exists. So an in-game hook
// can only move the window AFTER it has flashed up on the primary monitor for several
// seconds, which is worse than useless on a multi-monitor desk. SnapDevWindow.ps1 runs
// as a separate process and races the game: it waits for the window, hides it, moves
// it, and shows it again. DevClientWindow.java applies the same position from inside
// the game as a fallback for non-Windows machines.
var snapDevWindow = tasks.register('snapDevWindow') {
    description = 'Moves the dev client window onto the monitor given by dev_window_x/y.'
    doLast {
        if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
            logger.info('snapDevWindow: not Windows, leaving the window where it lands.')
            return
        }
        if (!dev_window_x?.trim() || !dev_window_y?.trim()) {
            logger.info('snapDevWindow: dev_window_x/y not set, skipping.')
            return
        }
        var script = rootProject.file('tools/SnapDevWindow.ps1')
        // Detached on purpose: this has to outlive the task and run WHILE the game
        // starts, so it cannot be a blocking exec.
        new ProcessBuilder('powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                '-File', script.absolutePath,
                '-X', dev_window_x.trim(), '-Y', dev_window_y.trim())
                .redirectErrorStream(true)
                .redirectOutput(ProcessBuilder.Redirect.DISCARD)
                .start()
        logger.lifecycle("snapDevWindow: watching for the client window, will place it at ${dev_window_x},${dev_window_y}.")
    }
}

tasks.matching { it.name in ['runClient', 'runClientJoin'] }.configureEach {
    dependsOn snapDevWindow
}

// The dev harness stays in the repo - it is how a change gets verified without a human
// at the keyboard - but must never reach players, so strip it from the published jar.
// Dev runs are unaffected: they run from the compiled classes directory, not this jar.
tasks.named('jar') {
    exclude 'nl/ljack2k/anvilous/dev/**'
    exclude 'nl/ljack2k/anvilous/client/DevClientWindow*'
    exclude 'nl/ljack2k/anvilous/client/ClientScreenshot*'
    exclude 'nl/ljack2k/anvilous/client/ClientRecipeBrowser*'
}

// Drop the freshly built jar into a local launcher instance so a rebuild is
// testable in a real client straight away.
//
// The path is machine-specific, so it never lives in this repo: put
//   prism_instance=C:/path/to/instances/<name>/minecraft
// in local.properties (gitignored) next to this file, or pass
// -Pprism_instance=... on the command line. Without it the task is not even
// registered, so nothing to break on anyone else's checkout.
var localProperties = rootProject.file('local.properties')
if (localProperties.exists()) {
    var loaded = new Properties()
    localProperties.withInputStream { loaded.load(it) }
    loaded.each { key, value -> if (!project.hasProperty(key)) { ext.set(key as String, value) } }
}

if (project.hasProperty('prism_instance')) {
    tasks.register('installToPrism', Copy) {
        description = 'Copies the built jar into the local Prism Launcher instance.'
        var modsDir = file("${prism_instance}/mods")
        // Clear out jars from earlier mod_versions, or they pile up and the
        // game loads two copies of the mod.
        doFirst { delete fileTree(modsDir) { include "${mod_name}-*.jar" } }
        from tasks.named('jar')
        into modsDir
    }
    tasks.named('build') { finalizedBy 'installToPrism' }
}
