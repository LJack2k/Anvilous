modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_display_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
# Served from the jar root (neoforge/src/main/resources/icon.png), generated from
# branding/Anvilous_logo.png - regenerate the set rather than editing it in place.
logoFile = "icon.png"
logoBlur = true

# Mixin config. The smithing menu has to be taught to consume more than one
# material per craft, which vanilla's SmithingMenu hardcodes to 1.
[[mixins]]
config = "anvilous.mixins.json"

# --- Required ---
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
