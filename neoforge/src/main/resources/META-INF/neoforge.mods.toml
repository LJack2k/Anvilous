modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_display_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
# Served from the jar root (neoforge/src/main/resources/icon.png), generated from
# branding/Anvilous_logo.png - regenerate the set rather than editing it in place.
logoFile = "icon.png"
logoBlur = true

# Mixin config. The smithing menu has to be taught to consume more than one
# material per craft, which vanilla's SmithingMenu hardcodes to 1.
[[mixins]]
config = "anvilous.mixins.json"

# --- Required ---
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# --- Optional ---
# Not needed, and the mod never mentions JEI unless JEI itself loads the plugin
# class by its annotation. The entry is here only for the version: the plugin is
# compiled against the API below and uses calls that older builds do not have, so
# without a range a too-old JEI would fail inside its own plugin loader with a
# NoSuchMethodError instead of a sentence anyone can read.
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "${jei_version_range}"
ordering = "NONE"
side = "CLIENT"

# The same bargain as JEI's: the EMI plugin class is loaded only by EMI itself,
# by its own annotation, and the range is here so a too-old EMI says so instead
# of failing inside its plugin loader.
[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "${emi_version_range}"
ordering = "NONE"
side = "CLIENT"
