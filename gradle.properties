# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod_id=anvilous
# mod_name is the *technical* name: it forms the jar archivesName. Keep it
# filename-safe (no spaces). mod_display_name is what players see in the mod
# list / resource-pack description, so never build a filename from it.
mod_name=Anvilous
mod_display_name=Anvilous
mod_license=MIT
mod_version=0.1.0
mod_group_id=nl.ljack2k.anvilous
mod_authors=LJack2k
# Loader for this branch - read by the release workflows so each MC line publishes
# with the correct loader tag.
mod_loaders=neoforge
mod_description=Repair tools and armor at the smithing table using materials a datapack chooses, each restoring its own percentage of maximum durability. Materials are named by item tag or by item, and several can share one recipe. Enchantments and components survive the repair untouched and nothing costs experience, so keeping a favourite tool alive no longer runs into the anvil's Too Expensive wall. Every recipe decides whether to reset, keep or grow the item's hidden anvil-use counter.

# Minecraft / NeoForge - verify at https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.242
neo_version_range=[21.1.181,)
loader_version_range=[4,)
# Java toolchain for this MC line (1.21.x = 21; 26.1+ = 25). Read by BOTH the
# Gradle toolchain (neoforge/build.gradle) and the release workflows, so a new
# MC line sets the JDK in exactly one place.
java_version=21

# Dev client window placement. Minecraft has no window-position argument, so the
# client is moved by tools/SnapDevWindow.ps1 before it can show up on the primary
# monitor. Virtual-desktop coordinates: negative X is a monitor to the LEFT of the
# primary one. Leave both blank to let the window land wherever it likes.
dev_window_x=-1920
dev_window_y=0

# Dev-only recipe browser, so recipes can be inspected the way a player sees them.
# Not a dependency of the mod - the jar runs identically without it.
jei_version=19.70.0.469
# The plugin is compiled against jei_version and calls API older builds lack, so
# the published range starts there. Loader-facing, unlike jei_version itself.
jei_version_range=[19.70.0.469,)

# Second dev-only viewer. EMI is here to answer whether a JEI plugin is picked up
# by a viewer that is not JEI; see recipe_viewer in neoforge/build.gradle.
emi_version=1.1.24+1.21.1
# As with JEI: the plugin is compiled against emi_version's API, so the published
# range starts there. EMI's own version strings carry the MC version after a +,
# which the loader compares as part of the version, hence the upper bound.
emi_version_range=[1.1.24,2.0)
