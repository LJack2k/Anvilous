# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod_id=anvilous
# mod_name is the *technical* name: it forms the jar archivesName. Keep it
# filename-safe (no spaces). mod_display_name is what players see in the mod
# list / resource-pack description, so never build a filename from it.
mod_name=Anvilous
mod_display_name=Anvilous
mod_license=MIT
mod_version=0.1.0
mod_group_id=nl.ljack2k.anvilous
mod_authors=LJack2k
# Loader for this branch - read by the release workflows so each MC line publishes
# with the correct loader tag.
mod_loaders=neoforge
mod_description=Repair tools and armor at the smithing table using materials a datapack chooses, each restoring its own percentage of maximum durability. Materials are named by item tag or by item, and several can share one recipe. Enchantments and components survive the repair untouched and nothing costs experience, so keeping a favourite tool alive no longer runs into the anvil's Too Expensive wall. Every recipe decides whether to reset, keep or grow the item's hidden anvil-use counter.

# Minecraft / NeoForge - verify at https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
neo_version=26.1.2.76
neo_version_range=[26.1,)
loader_version_range=[4,)
# Java toolchain for this MC line (1.21.x = 21; 26.1+ = 25). Read by BOTH the
# Gradle toolchain (neoforge/build.gradle) and the release workflows, so a new
# MC line sets the JDK in exactly one place.
java_version=25
