# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod_id=anvilous
# mod_name is the *technical* name: it forms the jar archivesName. Keep it
# filename-safe (no spaces). mod_display_name is what players see in the mod
# list / resource-pack description, so never build a filename from it.
mod_name=Anvilous
mod_display_name=Anvilous
mod_license=MIT
mod_version=0.1.0
mod_group_id=nl.ljack2k.anvilous
mod_authors=LJack2k
# Loader for this branch - read by the release workflows so each MC line publishes
# with the correct loader tag.
mod_loaders=neoforge
mod_description=Repair, combine and enchant your gear at the smithing table, paid for in materials instead of experience. Repairs restore a percentage of maximum durability per material item, named by item tag or by item; combining adds two worn items together; enchanting applies a book for a price a datapack sets per enchantment and per level. Enchantments and components survive untouched, nothing costs experience, and nothing runs into the anvil's Too Expensive wall. Every damageable item and every enchantment in vanilla is covered out of the box, combining included, from the game's own repair materials and anvil costs, and a datapack overrides any of it. The built-ins are three datapacks of their own — repair, combine, enchanting — each switchable off in the config, so a pack can start from nothing and ship only its own. The generators that built those sets ship behind a config switch, so a pack regenerates them for its own modded tools and enchantments in one command. Recipes show up in JEI, EMI and REI.

# Minecraft / NeoForge - verify at https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.242
neo_version_range=[21.1.181,)
loader_version_range=[4,)
# Java toolchain for this MC line (1.21.x = 21; 26.1+ = 25). Read by BOTH the
# Gradle toolchain (neoforge/build.gradle) and the release workflows, so a new
# MC line sets the JDK in exactly one place.
java_version=21

# Dev client window placement. Minecraft has no window-position argument, so the
# client is moved by tools/SnapDevWindow.ps1 before it can show up on the primary
# monitor. Virtual-desktop coordinates: negative X is a monitor to the LEFT of the
# primary one. Leave both blank to let the window land wherever it likes.
dev_window_x=-1920
dev_window_y=0

# Dev-only recipe browser, so recipes can be inspected the way a player sees them.
# Not a dependency of the mod - the jar runs identically without it.
jei_version=19.70.0.469
# The oldest JEI the plugin is known to build against, which is not the same as
# jei_version: dev runs against the newest, but the published bound should only
# exclude what actually fails. 19.44.0.403 compiles, so the earlier guess of
# 19.70 was shutting out a working combination - including the one in the Prism
# test instance. Raise it the day something here needs newer API.
jei_version_range=[19.44.0.403,)

# Second dev-only viewer. EMI is here to answer whether a JEI plugin is picked up
# by a viewer that is not JEI; see recipe_viewer in neoforge/build.gradle.
emi_version=1.1.24+1.21.1
# As with JEI: the plugin is compiled against emi_version's API, so the published
# range starts there. EMI's own version strings carry the MC version after a +,
# which the loader compares as part of the version, hence the upper bound.
emi_version_range=[1.1.24,2.0)
# Third dev-only viewer. REI's own JEI bridge, REI Plugin Compatibilities, is
# published for 1.16.5 Forge only, so REI users see nothing without this plugin.
rei_version=16.0.799
rei_version_range=[16.0.799,17.0)
